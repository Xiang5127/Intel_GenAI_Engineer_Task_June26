[package]
name = "intel-local-video-ai"
version = "0.1.0"
description = "Desktop frontend for the Intel Local Video AI MVP"
authors = ["Intel Local Video AI contributors"]
edition = "2021"

[lib]
name = "intel_local_video_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
protoc-bin-vendored = "3"
tauri-build = { version = "2", features = [] }
tonic-build = "0.12"

[dependencies]
prost = "0.13"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync"] }
tonic = { version = "0.12", features = ["transport"] }
